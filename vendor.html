<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your stall — Near &amp; Dear</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{--ink:#20231e;--muted:#777b72;--paper:#f7f7f2;--green:#244c3a;--lime:#d5ef79;--line:#e7e8df}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px 'DM Sans',sans-serif}.shell{max-width:850px;margin:auto;padding:0 24px}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font:800 20px Manrope,sans-serif;color:var(--green);text-decoration:none}.brand b{color:#799347}button{border:0;border-radius:999px;padding:10px 15px;font:700 12px 'DM Sans';cursor:pointer}.soft{background:#edf0e8;color:var(--green)}main{padding:55px 0}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;color:var(--green);font-size:10px;font-weight:700}h1{font:800 36px Manrope;letter-spacing:-1px;margin:10px 0}.sub{color:var(--muted);font-size:13px;line-height:1.6}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:25px;margin-top:25px}.status{display:inline-block;padding:8px 11px;border-radius:999px;background:#f1f3eb;color:#516342;text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.8px}.status.approved{background:#e7f1d7;color:#365b30}.status.rejected{background:#f7e8e4;color:#9e4a3a}.row{padding:13px 0;border-bottom:1px solid #f0f0eb}.row:last-child{border:0}.row small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.row b{font-size:13px}.notice{background:#f2f4ed;border-radius:12px;padding:15px;color:#62695c;font-size:12px;line-height:1.6;margin-top:15px}@media(max-width:600px){.shell{padding:0 18px}main{padding-top:37px}h1{font-size:30px}}
</style></head><body><div class="shell"><header class="top"><a class="brand" href="/">near<b>&amp;</b>dear <span style="font:500 11px 'DM Sans';color:#85877e">/ your stall</span></a><button class="soft" id="logout">Sign out</button></header><main id="main"><div class="sub">Loading your account…</div></main></div><script>
const main=document.getElementById('main');async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load account');return d}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}api('/api/vendor/me').then(({application:a})=>{if(!a){location.href='/';return}const state=a.status;main.innerHTML=`<div class="eyebrow">Vendor account</div><h1>Hi, ${esc(a.name)}.</h1><p class="sub">Here’s the latest on your stall.</p><section class="card"><span class="status ${esc(state)}">Application ${esc(state)}</span><div class="row" style="margin-top:12px"><small>STALL</small><b>${esc(a.name)}</b></div><div class="row"><small>CATEGORY</small><b>${esc(a.category)}</b></div><div class="row"><small>LOCATION</small><b>${esc(a.place)}</b></div><div class="notice">${state==='pending'?'Your application is with our neighbourhood team. We’ll publish your stall once it’s approved.':state==='approved'?'Your stall is live in the local discovery list.':'Your application was not approved. Please contact the team if you’d like help with your listing.'}</div></section>`}).catch(()=>location.href='/');document.getElementById('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.href='/'};
</script></body></html>
