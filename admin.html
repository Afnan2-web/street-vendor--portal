<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin review — Near &amp; Dear</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{--ink:#20231e;--muted:#777b72;--paper:#f7f7f2;--green:#244c3a;--lime:#d5ef79;--line:#e7e8df}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px 'DM Sans',sans-serif}.shell{max-width:1000px;margin:auto;padding:0 25px}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font:800 20px Manrope,sans-serif;color:var(--green);text-decoration:none}.brand b{color:#799347}.top a.back{font-weight:600;color:var(--green);text-decoration:none;font-size:12px}main{padding:48px 0 80px}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;color:var(--green);font-size:10px;font-weight:700}h1{font:800 34px Manrope,sans-serif;letter-spacing:-1px;margin:9px 0}p.sub{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 27px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:23px;margin:20px 0}.panel h2{font:700 18px Manrope;margin:0 0 8px}.form{max-width:410px}.form label{display:block;font-size:11px;font-weight:700;margin:15px 0 6px}.form input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font:inherit;outline:0}.form input:focus{border-color:#78945e}.btn{border:0;border-radius:999px;background:var(--green);color:#fff;font-weight:700;padding:12px 18px;cursor:pointer}.form .btn{margin-top:18px;width:100%}.btn:disabled{opacity:.5}.error{color:#a63d30;font-size:12px}.application{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin:12px 0}.application h3{margin:0 0 6px;font:700 16px Manrope}.application p{margin:4px 0;color:var(--muted);font-size:12px}.badge{display:inline-block;text-transform:uppercase;letter-spacing:.7px;font-size:9px;font-weight:700;border-radius:999px;padding:6px 8px;background:#f1f2ec;color:#68705e}.actions{display:flex;gap:8px}.actions button{border:0;border-radius:999px;padding:9px 13px;font-weight:700;font-size:11px;cursor:pointer}.approve{background:var(--lime);color:var(--green)}.reject{background:#f6e9e5;color:#9e4a3a}.empty{padding:30px;border:1px dashed #d6d9ce;border-radius:13px;color:var(--muted);text-align:center}.headrow{display:flex;justify-content:space-between;align-items:center;gap:12px}.secondary{background:#edf0e8;color:var(--green)}@media(max-width:600px){.shell{padding:0 17px}main{padding-top:32px}h1{font-size:29px}.application{grid-template-columns:1fr;gap:13px}.actions button{flex:1}}
</style></head><body><div class="shell"><header class="top"><a class="brand" href="/">near<b>&amp;</b>dear <span style="font:500 11px 'DM Sans';color:#85877e">/ admin</span></a><a class="back" href="/">← Back to site</a></header><main><div class="eyebrow">Neighbourhood operations</div><h1>Vendor applications</h1><p class="sub">Review new stalls and approve the ones ready to join the neighbourhood.</p><div id="app"><section class="panel form"><h2>Checking admin setup…</h2></section></div></main></div><script>
const app=document.getElementById('app');async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'Something went wrong');return d}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function authForm(setup){app.innerHTML=`<form class="panel form" id="auth"><h2>${setup?'Set up your admin password':'Admin sign in'}</h2><p class="sub">${setup?'This password protects the application review panel. Use at least 12 characters.':'Enter your admin password to review stall applications.'}</p><label for="pw">${setup?'Create password':'Password'}</label><input id="pw" type="password" required minlength="${setup?12:1}" autocomplete="${setup?'new-password':'current-password'}"><button class="btn" type="submit">${setup?'Create admin access':'Sign in'}</button><p class="error" id="error"></p></form>`;document.getElementById('auth').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await api(setup?'/api/admin/setup':'/api/admin/login',{method:'POST',body:JSON.stringify({password:document.getElementById('pw').value})});await dashboard()}catch(x){document.getElementById('error').textContent=x.message;b.disabled=false}}}async function dashboard(){try{await api('/api/admin/me');const d=await api('/api/admin/applications');app.innerHTML=`<div class="headrow"><h2 style="font:700 18px Manrope">Applications <span class="badge">${d.applications.filter(a=>a.status==='pending').length} pending</span></h2><button class="btn secondary" id="logout">Sign out</button></div><div id="list"></div>`;document.getElementById('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});authForm(false)};const list=document.getElementById('list');if(!d.applications.length){list.innerHTML='<div class="empty">No applications yet. New vendor applications will show up here.</div>';return}list.innerHTML=d.applications.slice().reverse().map(a=>`<article class="application"><div><h3>${esc(a.name)} <span class="badge">${esc(a.status)}</span></h3><p>${esc(a.category)} · ${esc(a.place)}</p><p>${esc(a.email)} · Submitted ${new Date(a.createdAt).toLocaleDateString()}</p></div><div class="actions">${a.status==='pending'?`<button class="approve" data-status="approved" data-id="${esc(a.id)}">Approve</button><button class="reject" data-status="rejected" data-id="${esc(a.id)}">Reject</button>`:''}</div></article>`).join('');list.onclick=async e=>{const b=e.target.closest('[data-status]');if(!b)return;b.disabled=true;try{await api(`/api/admin/applications/${encodeURIComponent(b.dataset.id)}/decision`,{method:'POST',body:JSON.stringify({status:b.dataset.status})});await dashboard()}catch(x){alert(x.message);b.disabled=false}}}catch(e){if(e.message==='Please sign in to continue.')authForm(false);else{app.innerHTML='<p class="error">Could not load applications.</p>';console.error(e)}}}api('/api/admin/setup-status').then(x=>x.configured?dashboard():authForm(true)).catch(()=>{app.innerHTML='<div class="empty">Could not reach the server. Start Near &amp; Dear and refresh.</div>'});
</script></body></html>
